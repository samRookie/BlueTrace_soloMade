openapi: 3.1.0
info:
  title: SIH26019 - National Land Governance Research & Policy Innovation Platform API
  description: Canonical HTTP execution layer, RBAC security baseline, and backend architecture for the SIH26019 platform.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Local Development Server

paths:
  /health:
    get:
      summary: Base Application Health Check
      description: Returns service availability status and architecture version baseline.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/health:
    get:
      summary: Versioned API Health Check
      description: Returns health status wrapped in the standard API response envelope with request ID.
      responses:
        '200':
          description: Successful health check
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Health'

  /api/v1/version:
    get:
      summary: API Version & Environment
      description: Returns current API version, architecture version, and runtime environment.
      responses:
        '200':
          description: Version information
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Version'

  /api/v1/auth/login:
    post:
      summary: Authenticate User
      description: Authenticates user credentials and sets a secure HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
                example: bluetrace_session=abc123...; HttpOnly; Path=/; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Login'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout User
      description: Terminates the active session and clears the session cookie.
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Logout'

  /api/v1/auth/me:
    get:
      summary: Get Current User Profile
      description: Returns the profile and permissions of the currently authenticated user.
      responses:
        '200':
          description: Active user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/audit/events:
    get:
      summary: List Audit Events
      description: Retrieves immutable compliance audit log entries. Requires audit:read permission.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: actorId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [SUCCESS, FAILURE, DENIED]
      responses:
        '200':
          description: Audit events list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_AuditEvents'
        '403':
          description: Forbidden (insufficient role permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/workspaces:
    get:
      summary: List User Workspaces
      description: Retrieves workspaces accessible to the authenticated user.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Accessible workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Workspaces'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/workspaces/{id}:
    get:
      summary: Get Workspace by ID
      description: Retrieves a single workspace. Protected against IDOR (returns 404 for unauthorized private workspaces).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Workspace'
        '404':
          description: Workspace not found or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/regions:
    get:
      summary: List Administrative Regions
      description: Retrieves a paginated list of regions with optional filtering by administrative level and name/code search.
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of records per page (1 to 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: level
          in: query
          description: Filter by administrative level
          schema:
            type: string
            enum: [NATIONAL, STATE, DISTRICT, BLOCK, VILLAGE]
        - name: search
          in: query
          description: Search term matching region name or code
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved paginated regions
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Regions'
        '400':
          description: Validation error in query parameters
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/regions/{id}:
    get:
      summary: Get Region by Identifier
      description: Retrieves a single administrative region by its unique ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the region
          schema:
            type: string
      responses:
        '200':
          description: Region found and returned
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_Region'
        '404':
          description: Region not found
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/resources/counts:
    get:
      summary: Get Platform Entity Counts
      description: Retrieves aggregated row counts for all foundational evidence graph tables.
      responses:
        '200':
          description: Entity counts retrieved successfully
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_ResourceCounts'

  /api/v1/dev/data-status:
    get:
      summary: Development Data Status Diagnostics
      description: Returns health, migration status, and seed counts for development diagnostics.
      responses:
        '200':
          description: Diagnostic report generated
          headers:
            x-request-id:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse_DataStatus'

components:
  headers:
    X-Request-ID:
      description: Unique correlation identifier for tracing request lifecycle across services.
      schema:
        type: string
        format: uuid

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@bluetrace.gov.in
        password:
          type: string
          format: password
          example: BlueTrace#Demo2026!

    AuthenticatedUser:
      type: object
      required:
        - id
        - email
        - name
        - role
        - status
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            [
              ADMIN,
              POLICY_OFFICER,
              RESEARCHER,
              ANALYST,
              VERIFIER,
              COMMUNITY_LEAD,
              DISPUTE_MEDIATOR,
              VIEWER,
            ]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        sampleFlag:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuditEventDto:
      type: object
      required:
        - id
        - action
        - status
        - createdAt
      properties:
        id:
          type: string
        actorId:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
        action:
          type: string
        targetType:
          type: string
          nullable: true
        targetId:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        status:
          type: string
          enum: [SUCCESS, FAILURE, DENIED]
        details:
          type: object
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WorkspaceDto:
      type: object
      required:
        - id
        - name
        - ownerId
        - ownerType
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        ownerType:
          type: string
          enum: [USER, INSTITUTION]
        visibility:
          type: string
          enum: [PUBLIC, RESTRICTED, INTERNAL]
        sampleFlag:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HealthCheckResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - architectureVersion
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        architectureVersion:
          type: string

    ApiMetadata:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ApiErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  BAD_REQUEST,
                  INTERNAL_ERROR,
                  SERVICE_UNAVAILABLE,
                ]
            message:
              type: string
            details:
              type: object
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Login:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
            session:
              type: object
              properties:
                id:
                  type: string
                expiresAt:
                  type: string
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Logout:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            loggedOut:
              type: boolean
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_User:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_AuditEvents:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEventDto'
            pagination:
              type: object
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Workspaces:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorkspaceDto'
            pagination:
              type: object
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Workspace:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WorkspaceDto'
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Health:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/HealthCheckResponse'
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Version:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            version:
              type: string
            architectureVersion:
              type: string
            environment:
              type: string
            status:
              type: string
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Regions:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
            pagination:
              type: object
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_Region:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_ResourceCounts:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            categories:
              type: object
            totalEntities:
              type: integer
        meta:
          $ref: '#/components/schemas/ApiMetadata'

    ApiSuccessResponse_DataStatus:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            database:
              type: object
            sampleDataSeeded:
              type: boolean
            counts:
              type: object
            architectureVersion:
              type: string
            environment:
              type: string
        meta:
          $ref: '#/components/schemas/ApiMetadata'
